<!doctype html>
<meta charset="utf-8">
<title>NemesisWatcher harness</title>
<body style="font:13px/1.5 ui-monospace,monospace;background:#111;color:#ddd;padding:16px">
<pre id="out">running…</pre>
<script type="module">
// config.js reads process.env for its tunables; Node provides it, a browser does not.
globalThis.process ??= { env: {} };

// Third-party sites block cross-origin reads, so absolute requests are bounced through
// the local PowerShell proxy. raw.githubusercontent already serves CORS *, and the
// single-threaded listener would serialise the archive files, so it goes straight out.
const nativeFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : input.url;
  const needsProxy = /^https?:\/\//.test(url)
    && !url.startsWith('http://127.0.0.1:8787')
    && !url.includes('raw.githubusercontent.com');
  if (needsProxy) return nativeFetch('/proxy?url=' + encodeURIComponent(url), { ...init, headers: undefined });
  return nativeFetch(input, init);
};

const out = document.getElementById('out');
const log = (...a) => { out.textContent += '\n' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x, null, 1)).join(' '); };
window.RESULT = { pending: true };

try {
  const [dates, names, model, history, bosslist, killstats, consensus, report] = await Promise.all([
    import('/src/lib/dates.js'), import('/src/lib/names.js'), import('/src/model.js'),
    import('/src/history.js'), import('/src/bosslist.js'), import('/src/sources/killstats.js'),
    import('/src/consensus.js'), import('/src/report.js'),
  ]);
  const { mapLimit } = await import('/src/lib/http.js');

  const checks = [];
  const check = (name, actual, expected) => {
    checks.push({ name, ok: JSON.stringify(actual) === JSON.stringify(expected), actual, expected });
  };

  // ---- date helpers -------------------------------------------------------------
  check('addDays fwd', dates.addDays('2026-08-22', 1), '2026-08-23');
  check('addDays back over month', dates.addDays('2026-03-01', -1), '2026-02-28');
  check('daysBetween', dates.daysBetween('2026-08-01', '2026-08-22'), 21);
  check('dayRange len', dates.dayRange('2026-08-20', '2026-08-22').length, 3);
  check('shortLabel', dates.shortLabel('2026-08-22'), '22 ago');
  check('killstatsDay before boundary', dates.currentKillstatsDay(new Date('2026-08-22T01:00:00Z')), '2026-08-21');
  check('killstatsDay after boundary', dates.currentKillstatsDay(new Date('2026-08-22T06:00:00Z')), '2026-08-22');
  check('killstatsDay winter', dates.currentKillstatsDay(new Date('2026-01-15T04:30:00Z')), '2026-01-15');
  check('killstatsDay winter early', dates.currentKillstatsDay(new Date('2026-01-15T03:30:00Z')), '2026-01-14');

  check('normalizeName', names.normalizeName("Gaz'haragoth"), 'gazharagoth');
  check('normalizeName casing', names.normalizeName('Arthom The Hunter'), names.normalizeName('Arthom the Hunter'));
  check('wikiUrl', names.wikiUrl('Man in the Cave'), 'https://tibia.fandom.com/wiki/Man_in_the_Cave');

  // ---- killstats extraction ------------------------------------------------------
  const sample = JSON.stringify({ killstatistics: { world: 'Havera', entries: [
    { race: 'Ferumbras', last_day_players_killed: 6, last_day_killed: 0, last_week_players_killed: 6, last_week_killed: 0 },
    { race: 'Grorlam', last_day_players_killed: 0, last_day_killed: 2, last_week_players_killed: 0, last_week_killed: 5 },
    { race: 'Zomba', last_day_players_killed: 0, last_day_killed: 0, last_week_players_killed: 0, last_week_killed: 3 },
  ] } }, null, 2);
  const act = killstats.extractDailyActivity(sample);
  check('extract skips idle race', act.has('Zomba'), false);
  check('extract keeps killer that survived', act.get('Ferumbras'), { killed: 0, playersKilled: 6 });
  check('extract keeps killed boss', act.get('Grorlam'), { killed: 2, playersKilled: 0 });

  // ---- history recording ----------------------------------------------------------
  const alias = new Map([['Ferumbras', 'Ferumbras'], ['Grorlam', 'Grorlam']]);
  const h = history.emptyHistory();
  history.applyDay(h, '2026-08-13', act, alias);
  history.applyDay(h, '2026-08-13', act, alias); // idempotent
  check('survivor recorded as appearance', h.bosses.Ferumbras.appearances, ['2026-08-13']);
  check('survivor not recorded as a kill', h.bosses.Ferumbras.killedOn, []);
  check('kill recorded', h.bosses.Grorlam.killedOn, ['2026-08-13']);
  check('schema stamped', h.schemaVersion, history.SCHEMA_VERSION);

  // A file written before versioning existed must be detected as stale, not silently
  // adopted — the defaults must never fill in a schemaVersion the file does not have.
  const legacyFile = { world: 'Havera', coverage: { from: '2025-07-18', to: '2026-08-22', days: 401 },
    bosses: { "Gaz'haragoth": { appearances: ['2025-09-03', '2025-10-18'] } } };
  const legacy = history.hydrateHistory(legacyFile);
  check('legacy file detected as stale', legacy.stale, true);
  check('legacy file reported as version 1', legacy.storedVersion, 1);
  check('legacy history discarded', Object.keys(legacy.history.bosses).length, 0);

  // Same data, but shaped as schema 2 writes it — this one must survive untouched.
  const current = history.hydrateHistory({ ...legacyFile, schemaVersion: history.SCHEMA_VERSION,
    bosses: { "Gaz'haragoth": { appearances: ['2025-09-03', '2025-10-18'], killedOn: ['2025-10-18'] } } });
  check('current file kept', current.stale, false);
  check('current history preserved', Object.keys(current.history.bosses).length, 1);

  const absent = history.hydrateHistory(null);
  check('missing file is not stale', absent.stale, false);
  check('missing file starts empty', absent.history.coverage.from, null);

  // The exact residue that survived the first fix: right version number, old-rule data.
  const mislabelled = { world: 'Havera', schemaVersion: history.SCHEMA_VERSION,
    coverage: { from: '2025-07-18', to: '2026-08-25', days: 404 },
    bosses: { Burster: { appearances: ["2026-08-22"] }, "Willi Wasp": { appearances: ['2026-08-23'], killedOn: ['2026-08-23'] } } };
  const caught = history.hydrateHistory(mislabelled);
  check('mislabelled file caught by shape', caught.stale, true);
  check('reason names the missing field', /killedOn/.test(caught.reason ?? ''), true);

  const healthy = { ...mislabelled, bosses: { Burster: { appearances: ['2026-08-22'], killedOn: ['2026-08-22'] } } };
  check('healthy schema-2 file kept', history.hydrateHistory(healthy).stale, false);
  check('force rebuilds a healthy file', history.hydrateHistory(healthy, { force: true }).stale, true);

  // Recipients: one secret, several destinations, whatever separator got pasted.
  const tg = await import('/src/telegram.js');
  check('one recipient', tg.parseRecipients('6150677303'), ['6150677303']);
  check('comma separated', tg.parseRecipients('123,456'), ['123', '456']);
  check('mixed separators and spaces', tg.parseRecipients(' 123 , -1001234567890 ; @canal '), ['123', '-1001234567890', '@canal']);
  check('newline separated', tg.parseRecipients('123\n456'), ['123', '456']);
  check('empty string', tg.parseRecipients(''), []);
  check('undefined', tg.parseRecipients(undefined), []);

  // ---- probability model -----------------------------------------------------------
  const every10 = ['2026-01-01','2026-01-11','2026-01-21','2026-01-31','2026-02-10','2026-02-20','2026-03-02'];
  const cooling = model.analyzeBoss(every10, '2026-03-05', { killedOn: every10 });
  check('cooldown status', cooling.status, 'cooldown');
  check('cooldown chance', cooling.chance, 0);
  check('cooldown daysToWindow', cooling.daysToWindow, 7);
  check('minGap', cooling.minGap, 10);
  check('killed boss is not still up', cooling.stillUp, false);
  const inWindow = model.analyzeBoss(every10, '2026-03-12', { killedOn: every10 });
  check('in-window status', inWindow.status, 'window');
  check('in-window chance > 0', inWindow.chance > 0, true);
  const overdue = model.analyzeBoss(every10, '2026-06-01', { killedOn: every10 });
  check('overdue status', overdue.status, 'overdue');
  check('overdue chance >= prior', overdue.chance >= overdue.prior, true);
  check('thin sample never certain', model.analyzeBoss(['2026-01-01','2026-01-30'], '2026-06-01', { killedOn: ['2026-01-01','2026-01-30'] }).chance <= 0.5, true);
  check('unseen', model.analyzeBoss([], '2026-03-05').status, 'unseen');
  check('single appearance', model.analyzeBoss(['2026-01-01'], '2026-03-05').status, 'insufficient');

  // consecutive days are one spawn straddling the daily refresh, not a 1-day respawn
  const straddling = ['2026-01-01','2026-01-02','2026-01-15','2026-01-16','2026-01-29','2026-01-30','2026-02-12'];
  const collapsed = model.analyzeBoss(straddling, '2026-02-20', { killedOn: straddling });
  check('runs collapsed into sightings', collapsed.sightings, 4);
  check('collapsed gaps', collapsed.gaps, [14, 14, 14]);
  check('collapsed boss not flagged unreliable', collapsed.unreliable, false);

  const noisy = model.analyzeBoss(['2026-01-01','2026-01-03','2026-01-30','2026-02-01','2026-03-20'], '2026-03-25', { killedOn: ['2026-01-01'] });
  check('multi-spawn flagged unreliable', noisy.unreliable, true);
  check('last sighting never killed => still up', noisy.stillUp, true);

  log('=== unit checks ===');
  for (const c of checks) log(`${c.ok ? 'PASS' : 'FAIL'}  ${c.name}` + (c.ok ? '' : `  got=${JSON.stringify(c.actual)} want=${JSON.stringify(c.expected)}`));
  const failed = checks.filter(c => !c.ok);
  log(`\n${checks.length - failed.length}/${checks.length} passed`);

  // ---- end-to-end against the real archive ---------------------------------------
  log('\n=== end-to-end ===');
  const listRaw = await fetch('/src/data/nemesis.json').then(r => r.json());
  const bossList = bosslist.indexBossList(listRaw);
  log(`boss list: ${bossList.bosses.length} nemesis, ${bossList.byKillStatsName.size} killstats aliases`);

  const today = '2026-08-22';
  const days = dates.dayRange(dates.addDays(today, -400), today);
  const hist = history.emptyHistory();
  const missingDays = [];
  const snaps = await mapLimit(days, 8, async (day) => {
    const raw = await killstats.fetchArchivedDay(day);
    if (!raw) { missingDays.push(day); return null; }
    return { day, activity: killstats.extractDailyActivity(raw) };
  });
  for (const s of snaps) if (s) history.applyDay(hist, s.day, s.activity, bossList.byKillStatsName);
  log(`backfilled ${days.length} days → coverage ${hist.coverage.from}..${hist.coverage.to} (${hist.coverage.days}d)`);
  log(`días no disponibles en el archivo: ${missingDays.length ? missingDays.join(', ') : 'ninguno'}`);
  log(`nemesis con apariciones: ${Object.keys(hist.bosses).length}`);

  const todaySnap = snaps[snaps.length - 1];
  const activityToday = new Map();
  for (const [raw, counters] of todaySnap.activity) {
    const pretty = bossList.byKillStatsName.get(raw);
    if (pretty) activityToday.set(pretty, counters);
  }

  const { fetchExternalSources } = await import('/src/sources/index.js');
  const externals = await fetchExternalSources();
  for (const s of externals) log(`  ${s.ok ? 'ok  ' : 'FAIL'} ${s.label}: ${s.ok ? s.entries.size + ' bosses' : s.error}`);

  const rows = consensus.buildConsensus({ bossList, history: hist, externals, today, activityToday });
  const buckets = consensus.bucketRows(rows);
  window.__HIST = hist;
  window.__ROWS = rows;
  log(`buckets: ${Object.entries(buckets).map(([k, v]) => `${k}=${v.length}`).join(' ')}`);

  const messages = report.buildReport({ day: today, buckets, history: hist, externals, bossList });
  log(`\nmessages: ${messages.length}, lengths: ${messages.map(m => m.length).join(', ')} (limit 4096)`);
  log('\n' + messages.map((m, i) => `----- mensaje ${i + 1} -----\n${m}`).join('\n\n'));

  const gaz = hist.bosses["Gaz'haragoth"];
  window.RESULT = {
    pending: false,
    unit: { total: checks.length, failed: failed.map(f => f.name) },
    coverage: hist.coverage,
    missingDays,
    tracked: Object.keys(hist.bosses).length,
    gazharagoth: gaz ? { appearances: gaz.appearances.slice(-8), killedOn: gaz.killedOn.slice(-8) } : null,
    buckets: Object.fromEntries(Object.entries(buckets).map(([k, v]) => [k, v.length])),
    survived: buckets.survived.map(r => `${r.name} (${r.playersKilledToday})`),
    stillUp: buckets.stillUp.map(r => `${r.name} (${r.own.daysSince}d)`),
    messageLengths: messages.map(m => m.length),
    top: buckets.high.slice(0, 10).map(r => ({ name: r.name, chance: Number((r.consensus ?? 0).toFixed(3)), days: r.own.daysSince, min: r.own.minGap, n: r.own.sightings, conf: r.own.confidence, unreliable: r.own.unreliable })),
    messages,
  };
} catch (err) {
  log('\nHARNESS ERROR: ' + (err && err.stack ? err.stack : String(err)));
  window.RESULT = { pending: false, error: String(err && err.stack ? err.stack : err) };
}
</script>
