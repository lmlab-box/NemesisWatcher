<!doctype html>
<meta charset="utf-8">
<title>NemesisWatcher harness</title>
<body style="font:13px/1.5 ui-monospace,monospace;background:#111;color:#ddd;padding:16px">
<pre id="out">running…</pre>
<script type="module">
// config.js reads process.env for its tunables; Node provides it, a browser does not.
globalThis.process ??= { env: {} };
// Third-party sites block cross-origin reads, so absolute requests are bounced through
// the local PowerShell proxy. Node fetches them directly, so this only exists for the harness.
const nativeFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : input.url;
  // raw.githubusercontent already serves CORS *, and the single-threaded proxy would
  // serialise the 180 archive files, so it goes straight out.
  const needsProxy = /^https?:\/\//.test(url) && !url.startsWith('http://127.0.0.1:8787') && !url.includes('raw.githubusercontent.com');
  if (needsProxy) {
    return nativeFetch('/proxy?url=' + encodeURIComponent(url), { ...init, headers: undefined });
  }
  return nativeFetch(input, init);
};
const out = document.getElementById('out');
const log = (...a) => { out.textContent += '\n' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x, null, 1)).join(' '); };
window.RESULT = { pending: true };

try {
  const [dates, names, model, history, bosslist, killstats, consensus, report] = await Promise.all([
    import('/src/lib/dates.js'), import('/src/lib/names.js'), import('/src/model.js'),
    import('/src/history.js'), import('/src/bosslist.js'), import('/src/sources/killstats.js'),
    import('/src/consensus.js'), import('/src/report.js'),
  ]);
  const { mapLimit } = await import('/src/lib/http.js');

  const checks = [];
  const check = (name, actual, expected) => {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    checks.push({ name, ok, actual, expected });
  };

  // ---- date helpers -------------------------------------------------------------
  check('addDays fwd', dates.addDays('2026-08-22', 1), '2026-08-23');
  check('addDays back over month', dates.addDays('2026-03-01', -1), '2026-02-28');
  check('daysBetween', dates.daysBetween('2026-08-01', '2026-08-22'), 21);
  check('dayRange len', dates.dayRange('2026-08-20', '2026-08-22').length, 3);
  check('shortLabel', dates.shortLabel('2026-08-22'), '22 ago');
  // 2026-08-22T01:00Z is 03:00 CEST -> before the 05:00 boundary -> still the 21st
  check('killstatsDay before boundary', dates.currentKillstatsDay(new Date('2026-08-22T01:00:00Z')), '2026-08-21');
  check('killstatsDay after boundary', dates.currentKillstatsDay(new Date('2026-08-22T06:00:00Z')), '2026-08-22');
  // winter: 04:30 UTC is 05:30 CET -> past the boundary
  check('killstatsDay winter', dates.currentKillstatsDay(new Date('2026-01-15T04:30:00Z')), '2026-01-15');
  check('killstatsDay winter early', dates.currentKillstatsDay(new Date('2026-01-15T03:30:00Z')), '2026-01-14');

  check('normalizeName', names.normalizeName("Gaz'haragoth"), 'gazharagoth');
  check('normalizeName casing', names.normalizeName('Arthom The Hunter'), names.normalizeName('Arthom the Hunter'));
  check('wikiUrl', names.wikiUrl('Man in the Cave'), 'https://tibia.fandom.com/wiki/Man_in_the_Cave');

  // ---- probability model ---------------------------------------------------------
  const every10 = ['2026-01-01','2026-01-11','2026-01-21','2026-01-31','2026-02-10','2026-02-20','2026-03-02'];
  const cooling = model.analyzeBoss(every10, '2026-03-05');
  check('cooldown status', cooling.status, 'cooldown');
  check('cooldown chance', cooling.chance, 0);
  check('cooldown daysToWindow', cooling.daysToWindow, 7);
  check('minGap', cooling.minGap, 10);
  const inWindow = model.analyzeBoss(every10, '2026-03-12');
  check('in-window status', inWindow.status, 'window');
  check('in-window chance > 0', inWindow.chance > 0, true);
  const overdue = model.analyzeBoss(every10, '2026-06-01');
  check('overdue status', overdue.status, 'overdue');
  check('overdue chance >= prior', overdue.chance >= overdue.prior, true);
  check('unseen', model.analyzeBoss([], '2026-03-05').status, 'unseen');
  check('single appearance', model.analyzeBoss(['2026-01-01'], '2026-03-05').status, 'insufficient');
  const noisy = model.analyzeBoss(['2026-01-01','2026-01-02','2026-01-30','2026-02-01','2026-03-20'], '2026-03-25');
  check('multi-spawn flagged unreliable', noisy.unreliable, true);
  check('high confidence needs samples', cooling.confidence, 'high');

  log('=== unit checks ===');
  for (const c of checks) log(`${c.ok ? 'PASS' : 'FAIL'}  ${c.name}` + (c.ok ? '' : `  got=${JSON.stringify(c.actual)} want=${JSON.stringify(c.expected)}`));
  const failed = checks.filter(c => !c.ok);
  log(`\n${checks.length - failed.length}/${checks.length} passed`);

  // ---- end-to-end against the real archive ---------------------------------------
  log('\n=== end-to-end ===');
  const listRaw = await fetch('/src/data/nemesis.json').then(r => r.json());
  const bossList = bosslist.indexBossList(listRaw);
  log(`boss list: ${bossList.bosses.length} nemesis, ${bossList.byKillStatsName.size} killstats aliases`);

  const today = '2026-08-22';
  const days = dates.dayRange(dates.addDays(today, -179), today);
  const hist = history.emptyHistory();
  let missing = 0;
  const snaps = await mapLimit(days, 8, async (day) => {
    const raw = await killstats.fetchArchivedDay(day);
    if (!raw) { missing++; return null; }
    return { day, kills: killstats.extractDailyKills(raw) };
  });
  for (const s of snaps) if (s) history.applyDay(hist, s.day, s.kills, bossList.byKillStatsName);
  log(`backfilled ${days.length} days (${missing} missing) → coverage ${hist.coverage.from}..${hist.coverage.to} (${hist.coverage.days}d)`);
  log(`nemesis with appearances: ${Object.keys(hist.bosses).length}`);

  const todaySnap = snaps[snaps.length - 1];
  const killsToday = new Map();
  for (const [raw, n] of todaySnap.kills) {
    const pretty = bossList.byKillStatsName.get(raw);
    if (pretty) killsToday.set(pretty, n);
  }
  log(`nemesis killed in the ${today} window: ${killsToday.size} → ${[...killsToday.keys()].join(', ') || '(none)'}`);

  const { fetchExternalSources } = await import('/src/sources/index.js');
  const externals = await fetchExternalSources();
  for (const s of externals) log(`  ${s.ok ? 'ok  ' : 'FAIL'} ${s.label}: ${s.ok ? s.entries.size + ' bosses' : s.error}`);
  const rows = consensus.buildConsensus({ bossList, history: hist, externals, today, killsToday });
  const buckets = consensus.bucketRows(rows);
  log(`buckets: killed=${buckets.killed.length} high=${buckets.high.length} possible=${buckets.possible.length} soon=${buckets.soon.length}`);

  const messages = report.buildReport({ day: today, buckets, history: hist, externals, bossList });
  log(`\nmessages: ${messages.length}, lengths: ${messages.map(m => m.length).join(', ')}, max limit 4096`);
  log('\n' + messages.map((m, i) => `----- mensaje ${i + 1} -----\n${m}`).join('\n\n'));

  window.RESULT = {
    pending: false, unit: { total: checks.length, failed: failed.map(f => f.name) },
    coverage: hist.coverage, tracked: Object.keys(hist.bosses).length,
    killedToday: [...killsToday.entries()],
    buckets: { killed: buckets.killed.length, high: buckets.high.length, possible: buckets.possible.length, soon: buckets.soon.length },
    messageLengths: messages.map(m => m.length),
    top: buckets.high.slice(0, 12).map(r => ({ name: r.name, chance: Number((r.consensus ?? 0).toFixed(3)), days: r.own.daysSince, min: r.own.minGap, n: r.own.appearances, conf: r.own.confidence, unreliable: r.own.unreliable })),
    messages,
  };
} catch (err) {
  log('\nHARNESS ERROR: ' + (err && err.stack ? err.stack : String(err)));
  window.RESULT = { pending: false, error: String(err && err.stack ? err.stack : err) };
}
</script>
