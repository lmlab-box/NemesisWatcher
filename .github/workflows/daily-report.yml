name: Daily Nemesis report

on:
  schedule:
    # tibia.com refreshes the Kill Statistics around 03:00-04:00 CE(S)T.
    # Both crons fire every day; the one that lands before 05:00 Berlin time sees a
    # killstats day it has already reported and exits without sending anything, so
    # exactly one report goes out whether Europe is on CET or CEST.
    - cron: '30 3 * * *' # 05:30 CEST / 04:30 CET
    - cron: '30 4 * * *' # 06:30 CEST / 05:30 CET
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the report and print it without sending to Telegram'
        type: boolean
        default: false
      force:
        description: 'Send again even if this killstats day was already reported'
        type: boolean
        default: false
      backfill_days:
        description: 'Days of history to rebuild from the archive when history is empty'
        type: string
        default: '400'

concurrency:
  group: nemesis-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A shallow clone cannot rebase onto the remote when the push below is
          # rejected, and that rebase is the whole point of the retry loop.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax check
        continue-on-error: true
        run: for f in $(find src scripts -name '*.js' -o -name '*.mjs'); do node --check "$f"; done

      - name: Refresh boss lists
        continue-on-error: true
        run: npm run refresh-lists

      - name: Build and send report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '400' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node src/index.js $ARGS

      - name: Commit updated history
        run: |
          git config user.name  "nemesis-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data src/data/nemesis.json

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: killstats history $(date -u +%Y-%m-%d)"

          # Anything pushed to main between the checkout and here — a commit of your own,
          # or a re-run of an older run — makes the push bounce. Rebase onto whatever is
          # on the remote and try again rather than failing the whole report.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt, rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done

          echo "could not push the history after 3 attempts"
          exit 1
